<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>STARFALL · 星坠 — 生成式视觉引擎</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2L30 16 16 30 2 16Z' fill='none' stroke='%237df9ff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23ff4fd8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="实时生成式视觉画布" role="img"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="frame" aria-hidden="true">
    <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  </div>

  <div class="hud" id="hud">
    <header class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color: var(--accent)"/>
            <stop offset="1" style="stop-color: var(--accent2)"/>
          </linearGradient>
        </defs>
        <path d="M16 2 L30 16 L16 30 L2 16 Z" fill="none" stroke="url(#mg)" stroke-width="1.2"/>
        <path d="M16 8 L24 16 L16 24 L8 16 Z" fill="none" stroke="url(#mg)" stroke-width="0.6" opacity="0.7"/>
        <circle cx="16" cy="16" r="1.5" fill="var(--accent)"/>
      </svg>
      <div class="brand-txt">
        <h1>STARFALL</h1>
        <p>星坠 · 生成式视觉引擎 <span class="sep">/</span> REALTIME WEBGL2</p>
      </div>
    </header>

    <aside class="telemetry" aria-label="运行状态">
      <div class="row fps-row"><span class="k">FPS</span><span class="v" id="fps">--</span></div>
      <div class="row"><span class="k">RENDER</span><span class="v dim" id="scale">100%</span></div>
      <div class="rule"></div>
      <div class="row"><span class="k">SCENE</span><span class="v" id="scene-id">—</span></div>
      <div class="row"><span class="k">DETAIL</span><span class="v dim" id="detail">—</span></div>
    </aside>

    <nav class="picker" id="picker" aria-label="场景切换"></nav>

    <div class="hints" aria-hidden="true">
      <span><kbd>拖拽</kbd> 扰动</span>
      <span><kbd>点击</kbd> 冲击波</span>
      <span><kbd>1–3</kbd> 切换</span>
      <span><kbd>空格</kbd> 暂停</span>
      <span><kbd>R</kbd> 重播种</span>
      <span><kbd>H</kbd> 隐藏界面</span>
    </div>

    <button class="audio" id="audio" type="button" aria-pressed="false" title="开启程序化环境音 (M)">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="audio-lbl">AMBIENT · OFF</span>
    </button>

    <div class="paused" id="paused" hidden>PAUSED</div>
  </div>

  <div class="boot" id="boot">
    <div class="boot-inner">
      <svg class="mark big" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 L30 16 L16 30 L2 16 Z" fill="none" stroke="url(#mg)" stroke-width="1.1"/>
        <path d="M16 8 L24 16 L16 24 L8 16 Z" fill="none" stroke="url(#mg)" stroke-width="0.5" opacity="0.7"/>
        <circle cx="16" cy="16" r="1.4" fill="var(--accent)"/>
      </svg>
      <h1>STARFALL</h1>
      <p class="cn">星坠 · 生成式视觉引擎</p>
      <div class="bar"><i id="boot-bar"></i></div>
      <p class="status" id="boot-status">BOOTING WEBGL2 CONTEXT…</p>
      <p class="fine">拖拽扰动 · 点击冲击 · 1–3 切换场景</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<noscript><div class="noscript">STARFALL 需要启用 JavaScript 与 WebGL2。</div></noscript>

<script src="src/glutil.js"></script>
<script src="src/post.js"></script>
<script src="src/scenes/nebula.js"></script>
<script src="src/scenes/tunnel.js"></script>
<script src="src/scenes/fluid.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
